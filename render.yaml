services:
  # -------------------------------------------------------------
  # NestJS Modular Backend API
  # -------------------------------------------------------------
  - type: web
    name: eldercare-api
    env: node
    plan: free
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: pnpm --filter eldercare-api run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: eldercare-postgres
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # Set to your Vercel frontend URL (e.g., https://eldercare.vercel.app)
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: alerts@eldercare360.health

  # -------------------------------------------------------------
  # Eldercare Background Worker (Escalations, Jobs, Digest)
  # -------------------------------------------------------------
  - type: worker
    name: eldercare-worker
    env: node
    plan: starter # Render background workers require starter tier or can run as background process
    region: oregon
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: pnpm --filter eldercare-worker run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eldercare-postgres
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: alerts@eldercare360.health

databases:
  # -------------------------------------------------------------
  # Managed PostgreSQL Database
  # -------------------------------------------------------------
  - name: eldercare-postgres
    databaseName: eldercare_db
    user: eldercare_admin
    plan: free
    region: oregon
    postgresMajorVersion: 16
